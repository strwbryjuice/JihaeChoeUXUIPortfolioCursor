      <img src="../images/ClearCheck/cc-01-cover.jpg" width="1925" height="1338" alt="Clear Check cover: a high-value second-hand trading service that uses an automated trade guide and an autonomous vehicle to reduce quality disputes between traders. Team project, May to July 2024, PBV and mobile app service design.">
      <img src="../images/ClearCheck/cc-02-overview.jpg" width="1925" height="913" alt="Overview: Clear Check is a high-value second-hand trading platform where an intermediary PBV verifies items and delivers them safely, using item-specific checklists to reduce information gaps." loading="lazy">

    <section class="section" id="background">
      <img src="../images/ClearCheck/cc-03-background.jpg" width="1925" height="1463" alt="Background: growing quality disputes in second-hand trading. Buyers' top inconvenience is checking item quality (47%), and quality is the top consumer complaint type (30.2%)." loading="lazy">
    </section>
    <section class="section" id="competitive-analysis">
      <img src="../images/ClearCheck/cc-04-competitive-analysis.jpg" width="1925" height="2882" alt="Competitive analysis: second-hand platforms compared by safe payment, intermediary management and communication, with three selected competitors and their strengths and weaknesses." loading="lazy">
    </section>
    <section class="section" id="field-research">
      <img src="../images/ClearCheck/cc-05-field-research.jpg" width="1925" height="2867" alt="Field research: a survey of 50 second-hand trading users and interviews with 6 users, showing they want verified quality and a safe trade for high-value items." loading="lazy">
      <img src="../images/ClearCheck/cc-06-affinity-diagram.jpg" width="1925" height="2514" alt="Affinity diagram: three key points from the research, leading to the question of how to trade verified high-value items quickly and safely at a low trading cost." loading="lazy">
    </section>
    <section class="section" id="persona">
      <img src="../images/ClearCheck/cc-07-persona.jpg" width="1925" height="1473" alt="Service personas: a seller who struggles to describe products, and a buyer who prefers direct trades for safety, each with motivation, pain points and needs." loading="lazy">
    </section>
    <section class="section" id="journey-map">
      <img src="../images/ClearCheck/cc-08-journey-map.jpg" width="1925" height="1871" alt="User journey map of a high-value second-hand trade from both the buyer's and the seller's side, with feelings, pain points, needs and solutions at each stage." loading="lazy">
    </section>
    <section class="section" id="brand-identity">
      <img src="../images/ClearCheck/cc-09-brand-identity.jpg" width="1925" height="3229" alt="Brand identity: the Clear Check logo concept, logo type, colour palette, typography, icon concept and logo variations." loading="lazy">
